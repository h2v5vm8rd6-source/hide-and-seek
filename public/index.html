 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прятки Онлайн</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  #controls-hint { display: none; }
  #action-buttons { position: absolute; right: 20px; bottom: 40px; display: flex; flex-direction: column; gap: 15px; z-index: 15; }
  .action-btn { border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; border: 2px solid; }
  #btn-action { width: 80px; height: 80px; background: rgba(124, 58, 237, 0.6); border-color: #a855f7; font-size: 14px; }
  #btn-jump { width: 60px; height: 60px; background: rgba(0, 212, 255, 0.6); border-color: #00d4ff; font-size: 20px; }
  #btn-crouch { width: 60px; height: 60px; background: rgba(255, 204, 0, 0.6); border-color: #ffcc00; font-size: 20px; }
</style>
</head>
<body>
<div id="menu" class="screen">
  <h1>🙈 ПРЯТКИ ОНЛАЙН</h1>
  <p class="subtitle">Один искатель — остальные прячутся!</p>
  <input type="text" id="player-name" placeholder="Твоё имя" maxlength="16">
  <button id="create-btn" class="big-btn">СОЗДАТЬ КОМНАТУ</button>
  <div class="divider">или</div>
  <input type="text" id="room-code" placeholder="КОД КОМНАТЫ" maxlength="5">
  <button id="join-btn" class="big-btn secondary">ВОЙТИ</button>
  <p id="menu-error" class="error"></p>
</div>
<div id="lobby" class="screen hidden">
  <h2>КОМНАТА</h2>
  <div id="room-code-display" class="room-code">----</div>
  <p class="hint">Отправь этот код друзьям</p>
  <div id="players-list" class="players-list"></div>
  <button id="start-btn" class="big-btn" style="display:none">НАЧАТЬ ИГРУ</button>
  <p id="lobby-hint" class="hint">Ждём игроков...</p>
</div>
<div id="game" class="screen hidden">
  <div id="hud">
    <div class="hud-item">⏱ <span id="timer">90</span>с</div>
    <div class="hud-item">🙈 <span id="alive-count">0</span></div>
    <div class="hud-item" id="role-display">—</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="message" class="message hidden"></div>
  <div id="joystick-container"><div id="joystick"></div></div>
  <div id="action-buttons">
    <button id="btn-action" class="action-btn">Действие</button>
    <div style="display: flex; gap: 10px;">
      <button id="btn-jump" class="action-btn">⬆</button>
      <button id="btn-crouch" class="action-btn">⬇</button>
    </div>
  </div>
  <p id="controls-hint">WASD / Стрелки — движение. На телефоне — джойстик.</p>
</div>
<script src="client.js"></script>
</body>
</html>
